# program settings
rngSeed: 1234
timerLevel: 3
logLevel: 1

# simulation box
simBoxLow: [0.0, 0.0, 0.0]
simBoxHigh: [10.0, 10.0, 10.0]
simBoxPBC: [false, false, false]
monolayer: false

# initialization box
initBoxLow: [0.0, 0.0, 0.0]
initBoxHigh: [10.0, 10.0, 10.0]

# initialization inside a circle along X direction
initCircularX: false
initPreSteps: 100

# components < -1  or > 1 will be randomly set
initOrient: [1, 0, 0]

# physical settings
viscosity: 1.0 #pN/(um^2.s)
KBT: -0.00411 #pN.um, 300K
linkKappa: 1000.0

# sylinder
sylinderFixed: false
sylinderNumber: 1
sylinderLength: 5.0 # um
sylinderLengthSigma: 0 # logNormal distribution
sylinderDiameter: 0.2 # um
sylinderColBuf: 0.2 #
sylinderDiameterColRatio: 1.0
sylinderLengthColRatio: 1.0

# timestepping
dt: 1.0 # s
timeTotal: 5.0 # s
timeSnap: 1.0 # s

# LCP Solver
conResTol: 1e-5
conMaxIte: 100000
conSolverChoice: 0

# hydro settings
mobilityTypeString: "RodMobility"
fmmMultOrder: 8
cellHydro:
  - group: 0
    forceExternal: [0.0, 0.0, 0.0] # pN
    torqueExternal: [0.0, 0.0, 0.0] # pN
    file: "Hydro0.csv"

