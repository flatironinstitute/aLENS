# program settings
rngSeed: 1234
initPreSteps: 5
logLevel: 3

# simulation box
simBoxLow: [0.0, 0.0, 0.0]
simBoxHigh: [100.0, 100.0, 100.0]
simBoxPBC: [false, false, false]
monolayer: false
# initialization box
initBoxLow: [0.0, 0.0, 0.0]
initBoxHigh: [100.0, 100.0, 100.0]
# initialization inside a circle along X direction
initCircularX: false
# components < -1  or > 1 will be randomly set
initOrient: [2, 2, 2]
# physical settings
viscosity: 1.0 #pN/(um^2.s)
KBT: -0.00411 #pN.um, 300K
linkKappa: 1000.0
# sylinder
sylinderFixed: false
sylinderNumber: 1000000
sylinderLength: 0.0 # um
sylinderLengthSigma: 0 # logNormal distribution
sylinderDiameter: 1.2 # um
sylinderColBuf: 1.0 # um Same as sylinderDiameter
sylinderDiameterColRatio: 1.0 #
sylinderLengthColRatio: 1.0 #
# timestepping
dt: 1.0 # s
timeTotal: 50.0 # s
timeSnap: 1.0 # s
# LCP Solver
conResTol: 1e-4
conMaxIte: 10000
conSolverChoice: 0
